<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="로또 6/45 번호 생성기 - 홀짝 비율, 합계, 연속 번호 조건을 지키는 무작위 번호 추천">
<title>로또 번호 생성기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23fbc400'/><text x='50' y='66' font-size='48' text-anchor='middle' font-family='sans-serif' font-weight='bold' fill='%23fff'>7</text></svg>">
<style>
  :root {
    --bg: #f5f6fb;
    --card: #ffffff;
    --text: #1f2333;
    --muted: #6b7084;
    --border: #e4e6ef;
    --accent: #4f46e5;
    --accent-press: #4338ca;
    --b1: #fbc400; --b2: #69c8f2; --b3: #ff7272; --b4: #aaaaaa; --b5: #b0d840;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12131a;
      --card: #1c1e28;
      --text: #eceef5;
      --muted: #9a9fb3;
      --border: #2c2f3d;
      --accent: #6d66f0;
      --accent-press: #5b54e0;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.5;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 20px; }

  .controls {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px; display: flex; flex-direction: column; gap: 14px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row label { font-weight: 600; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  .stepper button {
    width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 1.3rem; cursor: pointer;
  }
  .stepper output { min-width: 48px; text-align: center; font-size: 1.15rem; font-weight: 700; }
  .go {
    width: 100%; height: 54px; border: 0; border-radius: 14px;
    background: var(--accent); color: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer;
    touch-action: manipulation;
  }
  .go:active { background: var(--accent-press); transform: scale(.99); }

  .rules { font-size: .82rem; color: var(--muted); margin: 0; padding-left: 18px; }

  #results { list-style: none; padding: 0; margin: 20px 0 0; display: flex; flex-direction: column; gap: 10px; }
  .game {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 14px; animation: pop .25s ease-out both;
  }
  .game-head { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
  .game-head strong { color: var(--text); }
  .balls { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .ball {
    aspect-ratio: 1; max-width: 52px; width: 100%; justify-self: center;
    border-radius: 50%; display: grid; place-items: center;
    color: #fff; font-weight: 800; font-size: clamp(.95rem, 4.2vw, 1.2rem);
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    box-shadow: inset -3px -4px 8px rgba(0,0,0,.18), inset 3px 3px 6px rgba(255,255,255,.35);
  }
  .r1 { background: var(--b1); } .r2 { background: var(--b2); } .r3 { background: var(--b3); }
  .r4 { background: var(--b4); } .r5 { background: var(--b5); }

  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .actions button {
    flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: .95rem; cursor: pointer;
  }
  .hidden { display: none; }

  .disclaimer {
    margin-top: 24px; font-size: .82rem; color: var(--muted);
    border-top: 1px solid var(--border); padding-top: 14px;
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px;
    border-radius: 999px; font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: .92; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .game { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>🍀 로또 번호 생성기</h1>
  <p class="sub">로또 6/45 · 조건을 지키는 무작위 번호 추천</p>

  <section class="controls">
    <div class="row">
      <label for="count">게임 수</label>
      <div class="stepper">
        <button type="button" id="minus" aria-label="게임 수 줄이기">−</button>
        <output id="count" aria-live="polite">5</output>
        <button type="button" id="plus" aria-label="게임 수 늘리기">+</button>
      </div>
    </div>
    <button type="button" class="go" id="go">번호 뽑기</button>
    <ul class="rules">
      <li>1~45 중 중복 없이 6개, 오름차순</li>
      <li>홀:짝 비율 2:4 · 3:3 · 4:2</li>
      <li>합계 22~254, 3개 이상 연속 번호 제외</li>
    </ul>
  </section>

  <ul id="results" aria-live="polite"></ul>

  <div class="actions hidden" id="actions">
    <button type="button" id="copy">결과 복사</button>
    <button type="button" id="share">공유하기</button>
  </div>

  <p class="disclaimer">로또 당첨은 완전한 무작위 확률 게임이므로, 이 번호가 당첨을 보장하지 않습니다. 가볍고 재미로만 즐겨주세요!</p>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const MIN = 1, MAX = 10;
  let count = 5;
  let lastText = "";

  const $ = (id) => document.getElementById(id);
  const countEl = $("count");

  // 모듈로 편향 없는 0..max-1 균등 난수 (CSPRNG)
  function randomIndex(max) {
    const limit = 0x100000000 - (0x100000000 % max);
    const buf = new Uint32Array(1);
    let v;
    do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
    return v % max;
  }

  function drawGame() {
    const pool = Array.from({ length: 45 }, (_, i) => i + 1);
    const pick = [];
    for (let i = 0; i < 6; i++) pick.push(pool.splice(randomIndex(pool.length), 1)[0]);
    return pick.sort((a, b) => a - b);
  }

  function isValid(nums) {
    const odd = nums.filter((n) => n % 2).length;
    if (odd < 2 || odd > 4) return false;
    const sum = nums.reduce((a, b) => a + b, 0);
    if (sum <= 21 || sum >= 255) return false;
    let run = 1;
    for (let i = 1; i < nums.length; i++) {
      run = nums[i] - nums[i - 1] === 1 ? run + 1 : 1;
      if (run >= 3) return false;
    }
    return true;
  }

  function rangeClass(n) {
    return n <= 10 ? "r1" : n <= 20 ? "r2" : n <= 30 ? "r3" : n <= 40 ? "r4" : "r5";
  }

  function generate() {
    const games = [];
    while (games.length < count) {
      const g = drawGame();
      if (isValid(g)) games.push(g);
    }
    render(games);
  }

  function render(games) {
    const list = $("results");
    list.innerHTML = "";
    const lines = ["행운의 로또 번호 추천 결과입니다:"];
    games.forEach((nums, i) => {
      const odd = nums.filter((n) => n % 2).length;
      const sum = nums.reduce((a, b) => a + b, 0);
      lines.push(`- ${i + 1}게임: [ ${nums.join(", ")} ] (홀${odd}:짝${6 - odd} / 합계: ${sum})`);

      const li = document.createElement("li");
      li.className = "game";
      li.style.animationDelay = `${i * 40}ms`;
      li.innerHTML =
        `<div class="game-head"><strong>${i + 1}게임</strong><span>홀${odd}:짝${6 - odd} · 합계 ${sum}</span></div>` +
        `<div class="balls">${nums.map((n) => `<span class="ball ${rangeClass(n)}">${n}</span>`).join("")}</div>`;
      list.appendChild(li);
    });
    lines.push("", "로또 당첨은 완전한 무작위 확률 게임이므로, 이 번호가 당첨을 보장하지 않습니다. 가볍고 재미로만 즐겨주세요!");
    lastText = lines.join("\n");
    $("actions").classList.remove("hidden");
    $("share").classList.toggle("hidden", !navigator.share);
  }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove("show"), 1600);
  }

  function setCount(n) {
    count = Math.min(MAX, Math.max(MIN, n));
    countEl.textContent = count;
  }

  $("minus").addEventListener("click", () => setCount(count - 1));
  $("plus").addEventListener("click", () => setCount(count + 1));
  $("go").addEventListener("click", generate);

  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(lastText);
      toast("복사했어요");
    } catch {
      const ta = document.createElement("textarea");
      ta.value = lastText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast("복사했어요");
    }
  });

  $("share").addEventListener("click", async () => {
    try { await navigator.share({ title: "로또 번호 추천", text: lastText }); } catch { /* 취소 */ }
  });

  generate();
})();
</script>
</body>
</html>
